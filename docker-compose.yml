services:
  worker:
    build:
      context: .
      dockerfile: Dockerfile.worker
    ports:
      - "127.0.0.1:4100:4100"
    environment:
      DATA_MODE: ${DATA_MODE:-live}
      WORKER_API_TOKEN: ${WORKER_API_TOKEN:-}
      FRONTEND_ORIGINS: ${FRONTEND_ORIGINS:-http://localhost:3100}
      SUPABASE_URL: ${SUPABASE_URL:-}
      SUPABASE_SERVICE_ROLE_KEY: ${SUPABASE_SERVICE_ROLE_KEY:-}
    volumes:
      - pulse-data:/data
    restart: unless-stopped
volumes:
  pulse-data:
